<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Course Advisor</title>
  <style>
    body { font-family: Arial; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    #chat { border: 1px solid #ccc; border-radius: 8px; height: 420px; overflow-y: auto; padding: 12px; background: #fafafa; }
    .msg { margin: 8px 0; line-height: 1.4; }
    .user { color: #0056b3; }
    .bot { color: #222; }
    .sources { font-size: 12px; color: #777; margin-top: 2px; }
    #inputRow { display: flex; gap: 8px; margin-top: 12px; }
    #input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 18px; cursor: pointer; }
    #hint { font-size: 13px; color: #666; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h2>Institution Course Advisor (RAG Test)</h2>
  <p id="hint">Ask about courses, fees, modules, or careers. Registration is handled manually by our team.</p>
  <div id="chat"></div>
  <div id="inputRow">
    <input id="input" placeholder="e.g. What modules does Data Science have?" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
